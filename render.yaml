services:
  - type: web
    name: dropit-api
    runtime: docker
    rootDir: .
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: FRONTEND_URL
        sync: false
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: dropit-db
          property: connectionString
      - key: AWS_ACCESS_KEY
        sync: false
      - key: AWS_SECRET_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: AWS_BUCKET_NAME
        sync: false

databases:
  - name: dropit-db
    databaseName: dropit
    user: dropit
